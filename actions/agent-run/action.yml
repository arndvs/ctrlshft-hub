name: Sandcastle agent run
description: >
  Run a single Sandcastle agent workflow against the consuming repository.
  Checks out the hub engine at the pinned ref, installs deps, runs the engine
  against the consumer workspace (cwd), and summarizes the run. This is the
  SINGLE entry point consumers use — replacing the per-repo vendored
  setup/preflight/run/summary chain.

inputs:
  workflow:
    description: Name of the engine workflow to run (e.g. architecture-review, repo-hygiene).
    required: true
  ref:
    description: Hub ref to run from (branch, tag, or SHA). Default main.
    required: false
    default: main
  token:
    description: Token used for GitHub API + engine label operations.
    required: true
  extra-args:
    description: Extra CLI args passed verbatim to the engine after the workflow name.
    required: false
    default: ""
  node-version:
    description: Node.js version used by the engine.
    required: false
    default: "22"

outputs:
  should-run:
    description: "true/false — whether the engine actually ran (false if proxy preflight skipped)."

runs:
  using: composite
  steps:
    # The consumer repo IS the workspace the engine operates on ($GITHUB_WORKSPACE).
    # Without this checkout the workspace has no .git, and the engine's
    # WorktreeManager fails with "not a git repository". Full history
    # (fetch-depth: 0) is required for git worktree operations.
    - name: Checkout consumer repo (workspace)
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    - name: Checkout hub engine
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: arndvs/sandcastle-hub
        ref: ${{ inputs.ref }}
        path: sandcastle-hub
        fetch-depth: 1

    # Env needed by the engine (output files + failure reasons) and by
    # proxy_preflight.sh (model access). Composite actions CANNOT read the
    # secrets context — the consumer stub supplies LITELLM/ANTHROPIC via
    # job-level env:, and the token via this input.
    - name: Proxy preflight
      id: proxy-preflight
      shell: bash
      run: bash "$GITHUB_WORKSPACE/sandcastle-hub/templates/scripts/proxy_preflight.sh"

    - name: Check workflow enabled (disabledWorkflows)
      id: workflow-enabled
      shell: bash
      run: |
        set -euo pipefail
        out="$(bash "$GITHUB_WORKSPACE/sandcastle-hub/templates/scripts/check-workflow-enabled.sh" "${{ inputs.workflow }}")"
        if [[ "$out" == "enabled=true" ]]; then
          echo "workflow-enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "workflow-enabled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js
      if: steps.workflow-enabled.outputs.workflow-enabled == 'true'
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install engine dependencies
      if: steps.workflow-enabled.outputs.workflow-enabled == 'true'
      shell: bash
      run: |
        corepack enable
        cd "$GITHUB_WORKSPACE/sandcastle-hub/engine"
        pnpm --ignore-workspace install --frozen-lockfile
        # Put the engine's node_modules/.bin on PATH so the `claude` CLI
        # (from @anthropic-ai/claude-code) is invocable by the engine.
        echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

    # Disable agent commit attribution (Co-Authored-By trailers) so bot
    # commits pass the check-attribution gate. Claude Code adds the trailer
    # by default; this settings file (shipped from the hub) turns it off for
    # every consumer repo without per-repo work. Written to the consumer
    # workspace so the engine's `claude` invocation picks it up.
    - name: Disable agent commit attribution
      if: steps.workflow-enabled.outputs.workflow-enabled == 'true'
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.claude"
        cp "$GITHUB_WORKSPACE/sandcastle-hub/templates/claude-settings.json" "$GITHUB_WORKSPACE/.claude/settings.json"
        echo "Wrote .claude/settings.json (attribution disabled) to consumer workspace"

    # Code-health only: collect friction evidence + known findings so the lens
    # agent ranks by measured cost and suppresses already-known findings. The
    # engine reads these via FRICTION_CANDIDATES_FILE / KNOWN_FINDINGS_FILE.
    - name: Collect code-health friction evidence
      if: >
        inputs.workflow == 'code-health' &&
        steps.workflow-enabled.outputs.workflow-enabled == 'true' &&
        steps.proxy-preflight.outputs.should_run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        LABEL: source:code-health
        KNOWN_FILE: ${{ runner.temp }}/known_findings.json
      run: |
        set -euo pipefail
        # Known findings (open/fixed/declined) for dedup.
        bash "$GITHUB_WORKSPACE/sandcastle-hub/templates/scripts/collect-known-findings.sh"
        # Ranked friction candidates from the session store.
        python3 "$GITHUB_WORKSPACE/sandcastle-hub/templates/scripts/consolidate-friction.py" \
          --store "$GITHUB_WORKSPACE/.friction" \
          --known "$RUNNER_TEMP/known_findings.json" \
          --out "$RUNNER_TEMP/friction_candidates.json"

    - name: Run engine
      id: engine
      if: >
        steps.workflow-enabled.outputs.workflow-enabled == 'true' &&
        steps.proxy-preflight.outputs.should_run == 'true'
      shell: bash
      env:
        OUTPUT_DIR: ${{ runner.temp }}
        GITHUB_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        FRICTION_CANDIDATES_FILE: ${{ runner.temp }}/friction_candidates.json
        KNOWN_FINDINGS_FILE: ${{ runner.temp }}/known_findings.json
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/sandcastle-hub/engine"
        max_attempts=2
        for attempt in $(seq 1 "$max_attempts"); do
          echo "Running ${{ inputs.workflow }} attempt $attempt/$max_attempts (ref: ${{ inputs.ref }})"
          if pnpm --ignore-workspace exec tsx "$GITHUB_WORKSPACE/sandcastle-hub/run.ts" \
              "${{ inputs.workflow }}" \
              --repo "$GITHUB_WORKSPACE" \
              ${{ inputs.extra-args }}; then
            exit 0
          fi
          if [ "$attempt" -lt "$max_attempts" ]; then
            echo "::warning::${{ inputs.workflow }} attempt $attempt failed; retrying once in 30 seconds."
            sleep 30
          fi
        done
        echo "::error::${{ inputs.workflow }} failed after $max_attempts attempts."
        exit 1

    - name: Summarise run
      if: always()
      shell: bash
      env:
        OUTPUT_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        # Engine writes <workflow>_output.json (underscored) to OUTPUT_DIR.
        name=$(echo "${{ inputs.workflow }}" | tr '-' '_')
        output_file="${OUTPUT_DIR}/${name}_output.json"
        if [ ! -f "$output_file" ]; then
          echo "No output file produced for ${{ inputs.workflow }} — agent likely crashed before emitting a result."
          exit 0
        fi
        status=$(jq -r '.status // empty' "$output_file")
        echo "## ${{ inputs.workflow }}" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if [ "$status" = "proposed" ]; then
          # Two output shapes: single-proposal workflows (title/oneLineSummary)
          # and code-health (findings[]). Handle both.
          if jq -e '.findings' "$output_file" >/dev/null 2>&1; then
            echo "**Proposed findings:**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.findings[] | "- [\(.severity)] \(.title) (`\(.lens)`)"' "$output_file" >> "$GITHUB_STEP_SUMMARY"
          else
            title=$(jq -r '.title // "Untitled"' "$output_file")
            summary=$(jq -r '.oneLineSummary // ""' "$output_file")
            echo "**Proposed:** $title" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
        elif [ "$status" = "skipped" ]; then
          reason=$(jq -r '.reason // ""' "$output_file")
          echo "**Skipped** — $reason" >> "$GITHUB_STEP_SUMMARY"
        elif [ "$status" = "error" ]; then
          reason=$(jq -r '.reason // ""' "$output_file")
          echo "::error::${{ inputs.workflow }} reported an error: $reason"
          echo "**Agent error** — $reason" >> "$GITHUB_STEP_SUMMARY"
        else
          # An unrecognised status is more alarming than a crash — it means the
          # contract changed. Surface the payload rather than falling through
          # silently.
          echo "::error::${{ inputs.workflow }} returned unrecognised status '$status'. Raw output:"
          cat "$output_file"
          echo "**Unrecognised status \`$status\`** — raw output:" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$output_file" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi