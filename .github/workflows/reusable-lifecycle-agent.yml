name: Sandcastle reusable lifecycle agent

on:
  workflow_call:
    inputs:
      workflow:
        description: Engine workflow name (implement-prd, implement-issue, keep-tests-tight, update-branch, merge-pr, fix-pr-feedback).
        required: true
        type: string
      trigger-label:
        description: Lifecycle label that triggered this run (e.g. agent:implement-prd).
        required: true
        type: string
      object-type:
        description: GitHub object type (issue or pr) carrying lifecycle labels.
        required: true
        type: string
      object-number:
        description: Issue or PR number carrying lifecycle labels.
        required: true
        type: string
      engine-ref:
        description: Hub ref the engine should run from (branch, tag, or SHA). Default main.
        required: false
        type: string
        default: main
      extra-args:
        description: Extra CLI args passed to the engine after the workflow name.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: Timeout for the agent job.
        required: false
        type: number
        default: 45
      concurrency-key:
        description: Concurrency group key (usually the object number).
        required: false
        type: string
        default: default

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: sandcastle-${{ inputs.concurrency-key }}
      cancel-in-progress: false

    steps:
      - name: Transition labels (in-progress)
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          OBJECT_TYPE: ${{ inputs.object-type }}
          OBJECT_NUMBER: ${{ inputs.object-number }}
          TRIGGER_LABEL: ${{ inputs.trigger-label }}
        run: |
          gh "$OBJECT_TYPE" edit "$OBJECT_NUMBER" --remove-label "$TRIGGER_LABEL" -R ${{ github.repository }} || true
          gh "$OBJECT_TYPE" edit "$OBJECT_NUMBER" --remove-label "agent:blocked" -R ${{ github.repository }} || true
          gh "$OBJECT_TYPE" edit "$OBJECT_NUMBER" --add-label "agent:in-progress" -R ${{ github.repository }}

      - name: Run agent via hub action
        id: agent
        uses: arndvs/sandcastle-hub/actions/agent-run@main
        with:
          workflow: ${{ inputs.workflow }}
          ref: ${{ inputs.engine-ref }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          extra-args: ${{ inputs.extra-args }}

      - name: Teardown — remove trigger label
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          OBJECT_TYPE: ${{ inputs.object-type }}
          OBJECT_NUMBER: ${{ inputs.object-number }}
          TRIGGER_LABEL: ${{ inputs.trigger-label }}
        run: |
          gh "$OBJECT_TYPE" edit "$OBJECT_NUMBER" --remove-label "$TRIGGER_LABEL" -R ${{ github.repository }} || true

      - name: Teardown — mark blocked on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          OBJECT_TYPE: ${{ inputs.object-type }}
          OBJECT_NUMBER: ${{ inputs.object-number }}
          TRIGGER_LABEL: ${{ inputs.trigger-label }}
        run: |
          reason="(no reason file written — check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh "$OBJECT_TYPE" edit "$OBJECT_NUMBER" --add-label "agent:blocked" -R ${{ github.repository }} || true
          gh "$OBJECT_TYPE" comment "$OBJECT_NUMBER" -R ${{ github.repository }} --body "\`$TRIGGER_LABEL\` run failed. **Reason:** $reason. **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true