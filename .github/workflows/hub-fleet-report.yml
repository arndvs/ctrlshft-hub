name: "Fleet: Consumer Health Report"

# Consolidated fleet-level view of all ctrlshft-hub consumers.
# Runs the hub's own bin/scan-consumers.sh against the vendored identity
# manifest and opens one review PR listing hard failures (stale refs,
# missing AGENT_PAT secrets, missing hub-version.json pins).
#
# Self-contained: the scanner + manifest live in this repo, so the workflow
# needs no private-repo checkout and no cross-repo token grant. The hub has
# AGENT_PAT, knows its own SHA, and the consumers are its dependents.

on:
  schedule:
    - cron: "41 9 * * 1" # Mondays 09:41 UTC — aligns with consumer drift checks
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fleet-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hub (scanner + manifest)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          # GITHUB_TOKEN (not AGENT_PAT): the hub is public, and this token
          # carries contents:write from the workflow permissions, so the PR
          # step can push the report branch. AGENT_PAT is only needed for the
          # scanner's cross-repo API reads (set per-step below).

      - name: Run fleet scan
        id: scan
        env:
          # AGENT_PAT reads private consumers' hub-version.json + secrets via
          # the GitHub API. Falls back to GITHUB_TOKEN (public repos only).
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --ci resolves every consumer's state via the GitHub API (default
          # branch, hub-version.json, AGENT_PAT presence) so the runner does
          # not need local clones of the consumers.
          bash bin/scan-consumers.sh --ci --check > /tmp/fleet-report.txt 2>&1 || true
          cat /tmp/fleet-report.txt
          echo "report_path=ctrlshft-consumers/consumers.report.json" >> "$GITHUB_OUTPUT"

      - name: Open review PR on hard failures
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only open a PR if there are hard failures worth reviewing.
          if grep -q "CHECK FAILED" /tmp/fleet-report.txt; then
            branch="sandcastle/fleet-report-$(date +%Y%m%d)"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            cp /tmp/fleet-report.txt fleet-report.txt
            git add fleet-report.txt
            git commit -m "chore(fleet): consumer health report $(date +%Y%m%d)"
            # Force-push: the branch is regenerated daily and may already exist.
            git push -f origin "$branch"
            gh pr create -R ${{ github.repository }} \
              --base main \
              --head "$branch" \
              --title "chore(fleet): consumer health report $(date +%Y%m%d)" \
              --body "Fleet scan found hard failures. See fleet-report.txt for details." \
              || echo "PR already exists for $branch — branch updated."
          else
            echo "Fleet scan clean — no PR needed."
          fi